[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-news-intelligence-api"
version = "0.1.0"
description = "A FastAPI-based REST API for real-time financial news ingestion, NLP processing, and event streaming."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Alejandro Camerlengo", email = "placeholder@email.com" },
]
keywords = ["fastapi", "nlp", "finbert", "kafka", "mongodb", "financial-news"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# ── Runtime dependencies (to be populated per milestone) ─────────────────────
dependencies = [
    "feedparser>=6.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.1",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [

    # Testing
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    
    # Linting & formatting
    "ruff>=0.4",
    
    # Type checking
    "mypy>=1.10",
]

# ── Tool configurations ───────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "**/__init__.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = [".venv", "infra"]
